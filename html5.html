<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>縮小藥｜三位一體♡藥理循環</title>

  <meta
    name="description"
    content="縮小藥商品詳情、付款方式、配送方式與活動優惠。"
  >

  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="style3.css">
</head>

<body>
  <div class="viewport">
    <div class="page product-page">

      <!-- =====================
           導覽列
           ===================== -->
      <header
        class="box site-header"
        style="--x:0; --y:0; --w:1440; --h:210;"
      >
        <!-- 圖片：導覽列背景原圖 -->
        <div
          class="box header-background image-fill"
          style="--x:0; --y:0; --w:1440; --h:210;"
          aria-hidden="true"
        >
          <img
            src="images/深漸層.png"
            alt=""
          >
        </div>

        <!-- 品牌標誌 -->
        <a
          class="box header-link image-fill"
          style="--x:14; --y:5; --w:455; --h:106;"
          href="index.html"
          aria-label="三位一體♡藥理循環，回首頁"
        >
          <img
            src="images/三位一體♡藥理循環.png"
            alt="三位一體♡藥理循環"
          >
        </a>

        <!-- 搜尋功能目前保留外觀 -->
        <button
          class="box header-link nav-button"
          style="--x:1047; --y:48; --w:139; --h:99;"
          type="button"
          title="搜尋功能尚未串接"
          disabled
        >
          <span class="nav-text">搜尋</span>
        </button>

        <!-- 登入功能目前保留外觀 -->
        <button
          class="box header-link nav-button"
          style="--x:1180; --y:48; --w:139; --h:99;"
          type="button"
          title="登入功能尚未串接"
          disabled
        >
          <span class="nav-text">登入</span>
        </button>

        <!-- 連到第二頁：導覽選單 -->
        <a
          class="box header-link hamburger"
          style="--x:1336; --y:43; --w:48; --h:48;"
          href="html2.html"
          aria-label="開啟導覽選單"
        >
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </a>
      </header>

      <main>
        <!-- 商品區塊標題 -->
        <h1
          class="box section-title"
          style="--x:67; --y:205; --w:234; --h:69;"
        >
          商品下單
        </h1>

        <!-- =====================
             商品詳情
             ===================== -->
        <article
          class="box detail-panel"
          style="--x:60; --y:279; --w:1320; --h:710;"
          aria-labelledby="product-name"
        >
          <!-- 完整木製畫框圖片 -->
          <div
            class="box detail-frame image-fill"
            style="--x:0; --y:0; --w:1320; --h:710;"
            aria-hidden="true"
          >
            <img
              src="images/4商品框.png"
              alt=""
            >
          </div>

          <!-- 商品圖片底板 -->
          <div
            class="box detail-plate image-crop crop-detail-plate"
            style="--x:110; --y:47; --w:679; --h:578;"
            aria-hidden="true"
          >
            <img
              src="images/大商品底圖.png"
              alt=""
            >
          </div>

          <!-- 黃金瓦仔原圖：填滿目前顯示範圍 -->
          <div
            class="box detail-picture image-fill"
            style="--x:132; --y:47; --w:632; --h:578;"
          >
            <img
              src="images/縮小藥.png"
              alt="縮小藥"
              fetchpriority="high"
            >
          </div>

          <!-- 商品名稱 -->
          <h2
            id="product-name"
            class="box detail-name"
            style="--x:792; --y:101; --w:363; --h:55;"
          >
            縮小藥
          </h2>

          <!-- 商品描述 -->
          <p
            class="box body-text detail-copy"
            style="
              --x:792; --y:156; --w:363; --h:55;
              --font-size:16; --line-height:28;
            "
          >
            一口吞下縮小藥，世界瞬間變超大，連路過的螞蟻都對我冷笑，真是有夠荒謬。
          </p>

          <!-- 商品價格 -->
          <p
            class="box detail-price"
            style="--x:795; --y:225; --w:363; --h:55;"
          >
            $123,456
          </p>

          <!-- 結帳方式 -->
          <p
            class="box body-text detail-copy"
            style="--x:795; --y:280; --w:363; --h:36;"
          >
            結帳方式: 信用卡 \ 貨到付款 \ 行動支付
          </p>

          <!-- 配送方式 -->
          <p
            class="box body-text detail-copy"
            style="--x:795; --y:316; --w:383; --h:36;"
          >
            配送方式: 快速到貨 / 宅配到家 / 便利商店
          </p>

          <!-- 數量標籤 -->
          <label
            class="box body-text detail-copy"
            style="--x:795; --y:370; --w:80; --h:36;"
            for="gold-quantity"
          >
            數量:
          </label>

          <!--
            數量控制器目前為靜態外觀。
            數量固定為 1，尚未加入加減運算。
          -->
          <div
            class="box quantity-control"
            style="--x:868; --y:366; --w:116; --h:36;"
            role="group"
            aria-label="縮小藥購買數量"
          >
            <button
              class="quantity-button quantity-button--minus"
              type="button"
              aria-label="減少數量，示意按鈕"
              disabled
            >−</button>

            <input
              id="gold-quantity"
              class="quantity-input"
              type="number"
              name="quantity"
              min="1"
              value="1"
              readonly
              aria-label="縮小藥購買數量"
            >

            <button
              class="quantity-button quantity-button--plus"
              type="button"
              aria-label="增加數量，示意按鈕"
              disabled
            >+</button>
          </div>

          <!-- 折價優惠 -->
          <p
            class="box body-text detail-copy"
            style="--x:792; --y:422; --w:383; --h:36;"
          >
            折價優惠: 已為優惠商品，無法套用折價券
          </p>

          <!-- 收藏按鈕：目前保留外觀 -->
          <button
            class="box image-button favorite-button image-fill"
            style="--x:901; --y:566; --w:63; --h:63;"
            type="button"
            aria-label="收藏縮小藥，示意按鈕"
            title="收藏功能尚未串接"
            disabled
          >
            <img
              src="images/購物車icon-1.png"
              alt=""
            >
          </button>

          <!--
            購買按鈕目前先連到購物車。
            尚未自動加入商品或傳送數量。
          -->
          <a
            class="box image-button purchase-button image-crop crop-checkout"
            style="--x:974; --y:571; --w:226; --h:54;"
            href="html4.html"
            aria-label="前往購物車"
          >
            <img
              src="images/嚴肅結帳.png"
              alt=""
            >
          </a>
        </article>

        <!-- =====================
             活動優惠
             ===================== -->
        <section
          class="box promotions"
          style="--x:0; --y:1059; --w:1440; --h:402;"
          aria-labelledby="promotions-title"
        >
          <h2
            id="promotions-title"
            class="box section-title"
            style="--x:60; --y:0; --w:234; --h:69;"
          >
            活動優惠
          </h2>

          <div
            class="box image-fill"
            style="--x:60; --y:89; --w:817; --h:313;"
          >
            <img
              src="images/長banner.png"
              alt="趣味商品等您探索，現在就前往現場"
            >
          </div>

          <div
            class="box image-fill"
            style="--x:892; --y:89; --w:481; --h:313;"
          >
            <img
              src="images/1.png"
              alt="黃金瓦仔活動優惠"
            >
          </div>
        </section>
      </main>

      <!-- =====================
           頁尾
           ===================== -->
      <footer
        class="box footer"
        style="--x:0; --y:1703; --w:1440; --h:457;"
      >
        <div
          class="box footer-background image-crop crop-footer"
          style="--x:0; --y:0; --w:1440; --h:457;"
          aria-hidden="true"
        >
          <img
            src="images/footer.png"
            alt=""
          >
        </div>

        <!-- 客戶服務 -->
        <section
          class="box footer-column"
          style="--x:259; --y:163; --w:170; --h:200;"
          aria-labelledby="footer-service-title"
        >
          <h2
            id="footer-service-title"
            class="box footer-title"
            style="--x:0; --y:0; --w:170; --h:30;"
          >
            客戶服務
          </h2>

          <p
            class="box footer-copy"
            style="--x:0; --y:34; --w:170; --h:30;"
          >訂單/配送進度查詢</p>

          <p
            class="box footer-copy"
            style="--x:0; --y:65; --w:170; --h:30;"
          >取消訂單/退貨</p>

          <p
            class="box footer-copy"
            style="--x:0; --y:94; --w:170; --h:30;"
          >更改配送地址</p>

          <p
            class="box footer-copy"
            style="--x:0; --y:122; --w:170; --h:30;"
          >折價券說明</p>

          <p
            class="box footer-copy"
            style="--x:0; --y:149; --w:170; --h:30;"
          >FAQ常見問題</p>
        </section>

        <!-- 客戶權益 -->
        <section
          class="box footer-column"
          style="--x:531; --y:159; --w:170; --h:140;"
          aria-labelledby="footer-rights-title"
        >
          <h2
            id="footer-rights-title"
            class="box footer-title"
            style="--x:0; --y:0; --w:170; --h:30;"
          >
            客戶權益
          </h2>

          <p
            class="box footer-copy"
            style="--x:0; --y:34; --w:170; --h:30;"
          >客戶隱私政策</p>

          <p
            class="box footer-copy"
            style="--x:0; --y:65; --w:170; --h:30;"
          >客戶權利義務</p>

          <p
            class="box footer-copy"
            style="--x:0; --y:94; --w:170; --h:30;"
          >防詐騙宣導</p>
        </section>

        <!-- 藥師介紹 -->
        <section
          class="box footer-column"
          style="--x:803; --y:161; --w:170; --h:140;"
          aria-labelledby="footer-team-title"
        >
          <h2
            id="footer-team-title"
            class="box footer-title"
            style="--x:0; --y:0; --w:170; --h:30;"
          >
            藥師介紹
          </h2>

          <p
            class="box footer-copy"
            style="--x:1; --y:34; --w:170; --h:30;"
          >陳俐三 藥師</p>

          <p
            class="box footer-copy"
            style="--x:0; --y:65; --w:170; --h:30;"
          >陳婕佑 藥師</p>

          <p
            class="box footer-copy"
            style="--x:0; --y:94; --w:170; --h:30;"
          >陳受恩 藥師</p>
        </section>

        <!-- 聯絡我們 -->
        <section
          class="box footer-column"
          style="--x:1063; --y:163; --w:170; --h:140;"
          aria-labelledby="footer-contact-title"
        >
          <h2
            id="footer-contact-title"
            class="box footer-title"
            style="--x:0; --y:0; --w:170; --h:30;"
          >
            聯絡我們
          </h2>

          <p
            class="box footer-copy"
            style="--x:0; --y:34; --w:170; --h:30;"
          >地址</p>

          <p
            class="box footer-copy"
            style="--x:0; --y:64; --w:170; --h:30;"
          >電話</p>

          <p
            class="box footer-copy"
            style="--x:0; --y:95; --w:170; --h:30;"
          >官方社群</p>
        </section>
      </footer>

    </div>
  </div>
</body>
</html>
